name: Evening Message

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Evening Message to Feishu
        run: |
          curl -X POST "https://open.feishu.cn/open-apis/bot/v2/hook/ae7241f8-4bf9-4e82-8edf-f9a26717da84" -H "Content-Type: application/json" -d '{"msg_type":"text","content":{"text":"老师晚上好～\n一天终于杀青，各位辛苦了！\n\n不过躺平前先灵魂拷问一句：行程报了没？离21:00截止就差这最后一小时了！\n🔗 https://www.kdocs.cn/office/d/312887962611?share_id=F0KgmKCa6wPCPx&R=L1MvMTEx\n\n填完关机，安心躺平～🌙"}}'
